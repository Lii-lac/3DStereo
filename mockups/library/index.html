<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pocket library layouts</title>
<style>
:root { --bg:#121212; --chip:#2a2a2a; --green:#1ed760; --grey:#b3b3b3; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0a0a0a; color:#fff; font-family:"Segoe UI", system-ui, sans-serif; padding:26px 30px; }
.dir { display:flex; align-items:flex-start; gap:22px; margin-bottom:26px; }
.tag { width:24px; font:700 22px/1 "Segoe UI"; color:var(--green); padding-top:6px; }
.scr { position:relative; width:400px; height:240px; background:var(--bg); overflow:hidden; zoom:1.3; border-radius:2px; flex:none; }
.scr.b { width:320px; }
.scr.b .rail { bottom:52px; }
.hd { position:absolute; left:0; top:0; right:0; height:34px; display:flex; align-items:center; gap:6px; padding:0 6px; background:var(--bg); z-index:2; }
.ic { width:26px; height:24px; border-radius:12px; background:var(--chip); display:flex; align-items:center; justify-content:center; flex:none; }
.ic svg { width:14px; height:14px; fill:#fff; }
.ic.on { background:var(--green); width:auto; padding:0 11px 0 9px; gap:6px; font:700 12px/1 "Segoe UI"; color:#000; }
.ic.on svg { fill:#000; }
.grow { flex:1; }
.mini { position:absolute; left:6px; right:6px; bottom:6px; height:40px; border-radius:6px; background:#3a2a2a; z-index:3; display:flex; align-items:center; padding:0 8px; gap:8px; }
.mini .cv { width:26px; height:26px; border-radius:3px; }
.cv { border-radius:3px; flex:none; position:relative; overflow:hidden; }
.cv::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), transparent 55%); }
.round { border-radius:50%; }
.n { font:700 10px/1.2 "Segoe UI"; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.s { font:400 9px/1.25 "Segoe UI"; color:var(--grey); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ring { outline:2px solid #fff; outline-offset:2px; }
/* 1: a grid */
.grid { position:absolute; left:12px; right:12px; top:40px; display:grid; gap:12px 12px; }
.grid .cell .n { margin-top:6px; }
.grid.c { text-align:center; }
/* 2: roomy rows */
.rows { position:absolute; left:0; right:0; top:36px; }
.row { display:flex; align-items:center; height:48px; padding:0 22px 0 10px; gap:10px; }
.row.sel { background:rgba(255,255,255,.08); }
.row .n { font:600 12px/1.2 "Segoe UI"; }
.row .s { font-size:10px; }
.rail { position:absolute; right:4px; top:40px; bottom:8px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; font:700 6.5px/1 "Segoe UI"; color:#6a6a6a; z-index:2; }
.rail b { color:var(--green); }
.letter { font:800 13px/1 "Segoe UI"; color:var(--green); padding:8px 12px 2px; }
.song { display:flex; align-items:center; height:40px; padding:0 22px 0 12px; gap:10px; }
.song .n { font:600 11.5px/1.2 "Segoe UI"; }
.song .len { margin-left:auto; font:400 9px/1 "Segoe UI"; color:var(--grey); }
/* 3: one in the light */
.flow { position:absolute; left:0; right:0; top:34px; height:150px; }
.flow .cv { position:absolute; top:50%; transform:translate(-50%,-50%); box-shadow:0 6px 16px rgba(0,0,0,.6); }
.cap { position:absolute; left:0; right:0; text-align:center; }
.cap .n { font:800 15px/1.2 "Segoe UI"; }
.cap .s { font-size:10px; margin-top:2px; }
.dots { position:absolute; left:0; right:0; display:flex; justify-content:center; gap:4px; }
.dots i { width:4px; height:4px; border-radius:2px; background:#4a4a4a; }
.dots i.on { width:12px; background:var(--green); }
</style></head><body>

<svg width="0" height="0" style="position:absolute">
 <symbol id="burger" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="1.8" rx=".9"/><rect x="2" y="7.1" width="12" height="1.8" rx=".9"/><rect x="2" y="11.2" width="12" height="1.8" rx=".9"/></symbol>
 <symbol id="home" viewBox="0 0 16 16"><path d="M8 1.6 1.4 7.4h2v6.8h3.8V10h1.6v4.2h3.8V7.4h2z"/></symbol>
 <symbol id="lists" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="9" height="1.7" rx=".8"/><rect x="1.5" y="6.3" width="9" height="1.7" rx=".8"/><rect x="1.5" y="10.1" width="5.5" height="1.7" rx=".8"/><path d="M12 4.5v6.3a2 2 0 1 0 1.5 1.9V6.6l1.8.6V5.4z"/></symbol>
 <symbol id="artist" viewBox="0 0 16 16"><circle cx="8" cy="5.2" r="3.2"/><path d="M1.8 14.6c.6-3.3 3.1-5 6.2-5s5.6 1.7 6.2 5z"/></symbol>
 <symbol id="album" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 5.3a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4z"/></symbol>
 <symbol id="song" viewBox="0 0 16 16"><path d="M6 2.2v8.3a2.4 2.4 0 1 0 1.6 2.3V5.6l5.2-1.3v4.9a2.4 2.4 0 1 0 1.6 2.3V.9z"/></symbol>
 <symbol id="search" viewBox="0 0 16 16"><path d="M6.7 1.5a5.2 5.2 0 0 1 4.2 8.3l3.6 3.6-1.2 1.2-3.6-3.6A5.2 5.2 0 1 1 6.7 1.5zm0 1.7a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>
</svg>

<div id="out"></div>

<script>
const PL = [["Liked Songs","Playlist · 412 songs","liked"],["swing and a Miss","Playlist · Lilac","#8f86a6,#d8cfe0"],["foulwintercore","Playlist · Lilac","#5a2a22,#b0634a"],["Pylon","Playlist · Lilac","#4f5d48,#a7b08e"],["Dearie","Playlist · Lilac","#8c7a5a,#e2d2ad"],["late trains","Playlist · Lilac","#22304a,#6a7fa6"],["BESTie","Playlist · Lilac","#c23a5a,#f4c6cf"],["Asheghanistan","Playlist · Lilac","#2a2a2e,#7a7a86"]];
const AR = [["glaive","#3a4a6a,#a8b4cc"],["brakence","#4a1e22,#b05a4a"],["2hollis","#d6c2c8,#f6eef0"],["beabadoobee","#6a7a58,#d4d8b8"],["Lizzy McAlpine","#5a3a2a,#c8946a"],["ericdoa","#2a2a2a,#8a8a8a"],["kurtains","#6e5a3a,#d6b67a"],["BESTie","#b8344e,#f0b8c4"],["Jane Remover","#28324a,#7c8cb0"]];
const AL = [["Y'all","glaive","#3e5a2e,#c4cfa6"],["marroW","brakence","#3a1418,#a2424a"],["Pirouette","2hollis","#e8d8de,#c45a6a"],["God Save The Three","glaive, kurtains","#5a3a1e,#d6a85a"],["five seconds flat","Lizzy McAlpine","#2a2018,#8a6a4a"],["Pylon","beabadoobee","#5a6a58,#c8d0c0"],["Life 1","ericdoa","#7a4a1e,#e0a86a"]];
const SO = [["A","About Love","glaive","2:41","#3e5a2e,#c4cfa6"],["A","all the time","2hollis","2:12","#e8d8de,#c45a6a"],["A","Asheghanistan","glaive","3:02","#2a2a2e,#7a7a86"],["B","bad ideas","ericdoa","2:55","#7a4a1e,#e0a86a"],["B","bleach","brakence","3:18","#3a1418,#a2424a"],["B","Boston","Augustana","3:51","#22304a,#6a7fa6"]];
const bg = c => c === "liked" ? "linear-gradient(135deg,#0b6b30,#1ed760)" : `linear-gradient(150deg,${c})`;
const ic = id => `<div class="ic"><svg><use href="#${id}"/></svg></div>`;
const TABS = [["lists","Playlists"],["artist","Artists"],["album","Albums"],["song","Songs"]];
function header(on, search=true) {
  let h = `<div class="hd">${ic("burger")}${ic("home")}`;
  for (const [id,name] of TABS) h += id === on ? `<div class="ic on"><svg><use href="#${id}"/></svg>${name}</div>` : ic(id);
  return h + `<div class="grow"></div>${search ? ic("search") : ""}</div>`;
}
const mini = `<div class="mini"><div class="cv" style="background:${bg("#3a1418,#a2424a")}"></div><div><div class="n">madeleine</div><div class="s">brakence</div></div></div>`;
const scr = (w, inner) => `<div class="scr ${w === 320 ? "b" : ""}">${inner}${w === 320 ? mini : ""}</div>`;
const heart = `<svg viewBox="0 0 16 16" style="position:absolute;left:50%;top:50%;width:38%;transform:translate(-50%,-50%);fill:#fff"><path d="M8 14.5 2.2 8.9A3.6 3.6 0 0 1 8 4a3.6 3.6 0 0 1 5.8 4.9z"/></svg>`;
const cover = (c, s, round=false, extra="") => `<div class="cv ${round ? "round" : ""} ${extra}" style="width:${s}px;height:${s}px;background:${bg(c)}">${c === "liked" ? heart : ""}</div>`;

// 1: a grid of covers, names under
function gridPl(W) { const cols = W > 320 ? 4 : 3, s = (W - 24 - 12 * (cols - 1)) / cols;
  return `<div class="grid" style="grid-template-columns:repeat(${cols},${s}px)">` + PL.map((p,i) => `<div class="cell">${cover(p[2], s, false, i === 1 ? "ring" : "")}<div class="n">${p[0]}</div><div class="s">${p[1]}</div></div>`).join("") + `</div>`; }
function gridAr(W) { const cols = W > 320 ? 4 : 3, s = (W - 24 - 14 * (cols - 1)) / cols;
  return `<div class="grid c" style="grid-template-columns:repeat(${cols},${s}px);gap:12px 14px">` + AR.map(a => `<div class="cell">${cover(a[1], s, true)}<div class="n">${a[0]}</div></div>`).join("") + `</div>`; }
// 2: roomy rows, a letter rail to jump
const rail = sel => `<div class="rail">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => l === sel ? `<b>${l}</b>` : `<span>${l}</span>`).join("")}</div>`;
function rowsPl() { return `<div class="rows">` + PL.map((p,i) => `<div class="row ${i === 1 ? "sel" : ""}">${cover(p[2], 38)}<div style="min-width:0"><div class="n">${p[0]}</div><div class="s">${p[1]}</div></div></div>`).join("") + `</div>${rail("S")}`; }
function rowsAr() { return `<div class="rows">` + AR.map(a => `<div class="row">${cover(a[1], 38, true)}<div><div class="n">${a[0]}</div><div class="s">Artist</div></div></div>`).join("") + `</div>${rail("B")}`; }
// 3: one in the light, the rest either side
function flow(W, items, round, capY) {
  const cx = W / 2, mid = 2, big = W > 320 ? 112 : 104;
  let h = `<div class="flow">`;
  const spots = [[-2, .5, .34],[-1, .7, .6],[1, .7, .6],[2, .5, .34]];
  for (const [d, k, a] of spots) { const it = items[mid + d], s = big * k, x = cx + d * (W > 320 ? 92 : 76) + Math.sign(d) * (d * d > 1 ? 10 : 0);
    h += `<div class="cv ${round ? "round" : ""}" style="left:${x}px;width:${s}px;height:${s}px;background:${bg(it[round ? 1 : 2])};opacity:${a}"></div>`; }
  const it = items[mid];
  h += `<div class="cv ${round ? "round" : ""}" style="left:${cx}px;width:${big}px;height:${big}px;background:${bg(it[round ? 1 : 2])}">${it[2] === "liked" ? heart : ""}</div></div>`;
  h += `<div class="cap" style="top:${capY}px"><div class="n">${it[0]}</div><div class="s">${round ? "Artist · 38 songs" : it[1]}</div></div>`;
  h += `<div class="dots" style="top:${capY + 36}px">${items.slice(0,7).map((_,i) => `<i class="${i === mid ? "on" : ""}"></i>`).join("")}</div>`;
  return h;
}
// Songs, in all of them: rows, but roomier, under letters
function songs() { let h = `<div class="rows">`, last = "";
  for (const s of SO) { if (s[0] !== last) { h += `<div class="letter">${s[0]}</div>`; last = s[0]; }
    h += `<div class="song">${cover(s[4], 30)}<div style="min-width:0"><div class="n">${s[1]}</div><div class="s">${s[2]}</div></div><div class="len">${s[3]}</div></div>`; }
  return h + `</div>${rail("A")}`; }

const D = [
  ["1", scr(400, header("lists") + gridPl(400)), scr(320, header("artist") + gridAr(320))],
  ["2", scr(400, header("lists") + rowsPl()), scr(320, header("artist") + rowsAr())],
  ["3", scr(400, header("lists") + flow(400, PL, false, 196)), scr(320, header("artist") + flow(320, AR, true, 160))],
  ["♪", scr(400, header("song") + songs()), scr(320, header("song") + songs())],
];
document.getElementById("out").innerHTML = D.map(d => `<div class="dir"><div class="tag">${d[0]}</div>${d[1]}${d[2]}</div>`).join("");
</script>
</body></html>
