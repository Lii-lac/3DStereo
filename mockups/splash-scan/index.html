<script>
const G = '#1ed760', INK = '#121212', MUTE = '#7d786c', PAPER = '#f2e6cf';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, n, a) => { const e = document.createElementNS(NS, n); for (const k in (a || {})) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// the scan, as the splash is told it: files done of N, in bursts with pauses between (the card is slower on some)
const N = 553, SCAN_MS = 9000, HOLD_MS = 1700, TICK = 100;
function scanAt(ms) {
  const t = Math.min(1, ms / SCAN_MS);
  const w = [0, .07, .09, .31, .36, .62, .66, .93, 1];
  const x = Math.min(w.length - 2, t * (w.length - 1) | 0), f = t * (w.length - 1) - x;
  return lerp(w[x], w[x + 1], f < .5 ? 0 : ease((f - .5) * 2));
}

// what's on the card, in the order the folders come
const FILES = [
  "Alex G - Gnaw.mp3", "Alex G - Treehouse.flac", "Alex G - Sarah.flac",
  "Barry Manilow - Mandy.flac", "Barry Manilow - Copacabana.mp3",
  "Chappell Roan - Pink Pony Club.flac", "Chappell Roan - Good Luck, Babe!.opus", "Chappell Roan - Casual.flac",
  "Clairo - Bags.flac", "Clairo - Sofia.flac", "Clairo - Pretty Girl.m4a",
  "Cocteau Twins - Heaven or Las Vegas.flac", "Cocteau Twins - Cherry-coloured Funk.flac",
  "Dominic Fike - 3 Nights.flac", "Dominic Fike - Phone Numbers.mp3",
  "Joe Hisaishi - One Summer's Day.flac", "Joe Hisaishi - The Path of the Wind.flac", "Joe Hisaishi - Merry-Go-Round of Life.flac",
  "Mac DeMarco - Chamber of Reflection.flac", "Mac DeMarco - Salad Days.flac", "Mac DeMarco - Ode to Viceroy.mp3",
  "Olivia Rodrigo - drivers license.flac", "Olivia Rodrigo - vampire.flac", "Olivia Rodrigo - good 4 u.opus",
  "Sabrina Carpenter - Espresso.flac", "Sabrina Carpenter - Please Please Please.flac",
  "Stereolab - Ping Pong.flac", "Stereolab - French Disko.flac", "Stereolab - Cybele's Reverie.flac",
  "The Cranberries - Linger.flac", "The Cranberries - Zombie.mp3", "The Cranberries - Dreams.flac",
  "Weezer - Say It Ain't So.flac", "Weezer - Buddy Holly.flac",
];
const STEP = 12;   // one new name for every 12 files read, so the list moves about four times a second at most

// ---- top: the splash, and nine bars that light up and dance ------------------------------------------------------------------------
const tsv = document.getElementById('top');
el(tsv, 'rect', { width: 400, height: 240, fill: INK });
el(tsv, 'use', { href: '#art' });
const NB = 9, GAP = 10, X0 = 200 - (NB - 1) * GAP / 2, BASE = 226, bars = [];
// A level meter, not a staircase: every lit bar bounces on its own mix of beats, the middle ones livelier than the edges,
// between a 5 px stub and 17 px. The reading only decides how many are lit.
const ENV = i => .62 + .38 * Math.sin(Math.PI * (i + .5) / NB);
const wave = (i, t) => {
  const s = .5 + .5 * (.55 * Math.sin(t / 210 + i * 1.9) + .3 * Math.sin(t / 113 + i * 3.7 + 1) + .15 * Math.sin(t / 61 + i * 5.3));
  return clamp(s * ENV(i) * 1.12);
};
for (let i = 0; i < NB; i++) bars.push(el(tsv, 'rect', { x: X0 + i * GAP - 2.5, width: 5, rx: 2.5, fill: '#262626', opacity: 0 }));

// ---- bottom: the count, and the files going by ---------------------------------------------------------------------
const bot = document.getElementById('bot');
el(bot, 'rect', { width: 320, height: 240, fill: INK });
const grp = el(bot, 'g', { opacity: 0 });
el(grp, 'text', { x: 160, y: 58, 'text-anchor': 'middle', fill: MUTE, 'font-size': 13, 'letter-spacing': '.6', 'font-weight': 600 }).textContent = 'Reading songs';
const count = el(grp, 'text', { x: 160, y: 112, 'text-anchor': 'middle', 'font-weight': 700, style: 'font-variant-numeric:tabular-nums' });
const cDone = el(count, 'tspan', { 'font-size': 46, fill: '#fff' });
const cOf = el(count, 'tspan', { 'font-size': 20, fill: MUTE, 'font-weight': 600 });
const ROWS = [{ y: 150, o: .16 }, { y: 169, o: .3 }, { y: 188, o: .55 }, { y: 207, o: 1 }];
const rows = ROWS.map(r => {
  const t = el(grp, 'text', { x: 160, y: r.y, 'text-anchor': 'middle', 'font-size': 11.5, opacity: r.o });
  return { name: el(t, 'tspan', { fill: r.o === 1 ? PAPER : '#cfc9bb' }), ext: el(t, 'tspan', { fill: G, opacity: .8 }) };
});
const fit = s => s.length > 41 ? s.slice(0, 22) + '…' + s.slice(-18) : s;   // a long one loses its middle, not its ending
let lastK = -1;
function files(done) {
  const k = Math.floor(done / STEP);
  if (k === lastK) return; lastK = k;
  rows.forEach((r, j) => {
    const n = k - (rows.length - 1 - j);
    if (n < 0) { r.name.textContent = ''; r.ext.textContent = ''; return; }
    const f = FILES[n % FILES.length], d = f.lastIndexOf('.');
    r.name.textContent = fit(f.slice(0, d)); r.ext.textContent = f.slice(d);
  });
}

// ---- the timeline -------------------------------------------------------------------------------------------------
let t0 = performance.now();
const fix = /t=(\d+)/.exec(location.hash);   // page.html#t=3200 freezes it at that moment (for stills)
document.getElementById('replay').onclick = () => { t0 = performance.now(); lastK = -1; };
function frame(now) {
  if (fix) now = t0 + +fix[1];
  const ms = (now - t0) % (SCAN_MS + HOLD_MS);
  const q = Math.floor(ms / TICK) * TICK;             // the device redraws about ten times a second: everything steps like that
  const p = ms >= SCAN_MS ? 1 : scanAt(q);
  const done = Math.round(p * N);
  const hold = ms - SCAN_MS, fold = ms >= SCAN_MS + 1500 ? clamp((ms - SCAN_MS - 1500) / 200) : 0;
  const on = p > 0 ? 1 : 0, lit = p * NB;
  const qt = Math.floor(now / TICK) * TICK;           // the beat steps with the screen too
  bars.forEach((b, i) => {
    const a = clamp(lit - i), h = (5 + 12 * wave(i, qt) * a) * (1 - fold);   // lit once the reading has reached it; it eases in, then dances
    b.setAttribute('opacity', on && h > .6 ? 1 : 0); b.setAttribute('fill', a > 0 ? G : '#262626');
    b.setAttribute('height', Math.max(h, .1)); b.setAttribute('y', BASE - h);
  });
  grp.setAttribute('opacity', on ? (1 - fold) * clamp(ms / 400) : 0);
  cDone.textContent = done; cDone.setAttribute('fill', done >= N ? G : '#fff'); cOf.textContent = ' / ' + N;
  files(done);
  document.getElementById('pct').textContent = ms >= SCAN_MS ? '' : done + ' / ' + N;
  if (!fix) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
